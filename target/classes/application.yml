spring:
  application:
    name: sayibulmaca
  datasource:
    url: jdbc:postgresql://localhost:5432/sayibulmaca
    username: sayibulmaca
    password: sayibulmaca_dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

game:
  time-control:
    fast:
      digits-4: 120
      digits-5: 180
    normal:
      digits-4: 240
      digits-5: 360
    long:
      digits-4: 480
      digits-5: 720
  secret-setup-timeout-seconds: 30
  max-guesses-per-player: 30
  first-move-timeout-seconds: 30

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  mock-enabled: ${FIREBASE_MOCK_ENABLED:false}
